name: Build and deploy GitHub Pages

on:
  pull_request:
    branches:
      - dev
      - uat
      - main
  push:
    branches:
      - dev
      - uat
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deploy path
        shell: bash
        run: |
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            TARGET_BRANCH="${GITHUB_BASE_REF}"
          fi

          case "${TARGET_BRANCH}" in
            main)
              echo "BASE_HREF=/reader-poc/" >> "${GITHUB_ENV}"
              echo "DESTINATION_DIR=." >> "${GITHUB_ENV}"
              ;;
            uat)
              echo "BASE_HREF=/reader-poc/uat/" >> "${GITHUB_ENV}"
              echo "DESTINATION_DIR=uat" >> "${GITHUB_ENV}"
              ;;
            dev)
              echo "BASE_HREF=/reader-poc/dev/" >> "${GITHUB_ENV}"
              echo "DESTINATION_DIR=dev" >> "${GITHUB_ENV}"
              ;;
            *)
              echo "Unsupported target branch: ${TARGET_BRANCH}" >&2
              exit 1
              ;;
          esac

      - name: Build
        run: npm run build -- --base-href "${BASE_HREF}"

      - name: Deploy branch folder
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/reader-poc/browser
          destination_dir: ${{ env.DESTINATION_DIR }}
          keep_files: true
